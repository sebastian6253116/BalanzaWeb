# NOT for Dokploy.
#
# Dokploy deploys the root Dockerfile and Traefik already terminates TLS and
# routes the domain to the container. Running this Caddy service next to
# Dokploy would compete for ports 80/443 and break certificate issuance.
#
# This file is only the alternative for a bare VPS without Dokploy.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /app/data/balanzaweb.db
      WEB_DIR: /app/apps/web/dist
      TRUST_PROXY: "1"
      LOG_REQUESTS: "1"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
    volumes:
      - ./data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# No MySQL service yet: the API is SQLite-only today. When the MySQL adapter
# lands, add the database service here and point the API at it.
volumes:
  caddy_data:
  caddy_config:
